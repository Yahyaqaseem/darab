name: darb_mobile
description: "DARB (دَرْب) - Iraqi Live Driver Intelligence & Navigation Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.1
  
  # Networking & WebSockets
  dio: ^5.4.1
  socket_io_client: ^2.0.3+1
  
  # Local Storage & Preferences
  shared_preferences: ^2.2.2
  
  # UI & Design System
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  latlong2: ^0.9.0
  flutter_map: ^6.1.0
  
  # Device & Location
  geolocator: ^11.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

