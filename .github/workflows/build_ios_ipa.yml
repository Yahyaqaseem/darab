name: DARB iOS IPA Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Unsigned / Ad-Hoc IPA
        working-directory: apps/mobile
        run: |
          # Generate Podfile and config
          flutter build ios --config-only --no-codesign || true
          
          # Force Manual Provisioning
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # Force completely disable signing for the Runner project
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          
          # Flutter builds the xcarchive successfully, but fails at the export step because we have no team.
          # We add || true to catch the export failure, so we can manually extract the built .app!
          flutter build ipa --release --no-codesign || flutter build ios --release --no-codesign || true
          
          echo "Locating the generated Runner.app..."
          APP_PATH=$(find build/ios ios/build -name "Runner.app" -type d | head -n 1)
          
          echo "Found app at: $APP_PATH"
          
          mkdir -p build/ios/ipa/Payload
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/ios/ipa/Payload/
          else
            echo "ERROR: Runner.app not found! Xcode completely refused to build it."
            exit 1
          fi
          
          cd build/ios/ipa && zip -ry DARB.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARB-iOS-Release-IPA
          path: apps/mobile/build/ios/ipa/DARB.ipa
