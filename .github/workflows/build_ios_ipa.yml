name: DARB iOS IPA Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Prepare iOS Build and CocoaPods
        working-directory: apps/mobile
        run: |
          # Generate Podfile and config without building
          flutter build ios --config-only --no-codesign
          
          cd ios
          # Uncomment and set platform to 14.0 to prevent maplibre_gl compatibility errors
          cat Podfile | sed -E "s/^#? ?platform :ios.*/platform :ios, '14.0'/g" > Podfile.tmp
          
          # Inject custom MapLibre podspec source at the very top of the Podfile
          echo "source 'https://github.com/m0nac0/flutter-maplibre-podspecs.git'" > Podfile.new
          echo "source 'https://cdn.cocoapods.org/'" >> Podfile.new
          cat Podfile.tmp >> Podfile.new
          mv Podfile.new Podfile
          
          # Force a full repo update and install
          pod install --repo-update

      - name: Build Unsigned / Ad-Hoc IPA
        working-directory: apps/mobile
        run: |
          flutter build ipa --no-codesign --release
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -ry DARB.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARB-iOS-Release-IPA
          path: apps/mobile/build/ios/ipa/DARB.ipa
