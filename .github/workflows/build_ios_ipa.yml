name: DARB iOS IPA Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get


      - name: Build Unsigned / Ad-Hoc IPA
        working-directory: apps/mobile
        run: |
          # Clean build to start fresh
          flutter clean
          flutter pub get
          
          # Flutter creates a complete, fully-linked .xcarchive but fails at the export step.
          # We catch the failure with || true, preserving the perfect .xcarchive.
          flutter build ipa --release --no-codesign || true
          
          echo "Scanning for generated xcarchive..."
          ARCHIVE_PATH=$(find build/ios -name "*.xcarchive" -type d | head -n 1)
          
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "ERROR: No xcarchive found! Xcode failed to build the app entirely."
            exit 1
          fi
          
          echo "Archive found at $ARCHIVE_PATH. Locating Runner.app inside..."
          APP_PATH=$(find "$ARCHIVE_PATH" -name "Runner.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found inside the archive!"
            exit 1
          fi
          
          echo "Found full Runner.app at $APP_PATH. Packaging using rsync to preserve symlinks..."
          
          mkdir -p build/ios/ipa/Payload
          
          # Use rsync -a to strictly preserve all symlinks, permissions, and structure
          # This is critical for Sideloadly to parse the frameworks correctly.
          rsync -a "$APP_PATH/" build/ios/ipa/Payload/Runner.app/
          
          cd build/ios/ipa
          # Zip with -y to preserve symlinks inside the zip file
          zip -ry DARB.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARB-iOS-Release-IPA
          path: apps/mobile/build/ios/ipa/DARB.ipa
