name: DARB iOS IPA Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Unsigned / Ad-Hoc IPA
        working-directory: apps/mobile
        run: |
          # Generate Podfile and config
          flutter build ios --config-only --no-codesign || true
          
          # Force Manual Provisioning
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # Force completely disable signing for the Runner project
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          
          # Inject completely disabled signing for all CocoaPods
          if [ -f "ios/Podfile" ]; then
            perl -pi -e 's/flutter_additional_ios_build_settings\(target\)/flutter_additional_ios_build_settings\(target\)\n      target.build_configurations.each do |config|\n        config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"\n        config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n        config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""\n      end/g' ios/Podfile
          fi
          
          # Build the Dart AOT and setup iOS project
          flutter build ios --config-only --no-codesign --release || true
          
          # Go to ios directory and forcefully build the unsigned .app
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build || true
          cd ..
          
          mkdir -p build/ios/iphoneos/Payload
          cp -R ios/build/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/ || cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/ || true
          cd build/ios/iphoneos && zip -ry DARB.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARB-iOS-Release-IPA
          path: apps/mobile/build/ios/iphoneos/DARB.ipa
