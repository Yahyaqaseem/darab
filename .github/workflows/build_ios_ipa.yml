name: DARB iOS IPA Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get


      - name: Build Unsigned / Ad-Hoc IPA
        working-directory: apps/mobile
        run: |
          # Clean build to avoid artifact corruption
          flutter clean
          flutter pub get
          
          # Build the iOS app bundle natively without code signing
          # We add || true just in case Flutter throws the Development Team warning at the very end,
          # but the Runner.app itself is already fully compiled and linked!
          flutter build ios --release --no-codesign || true
          
          echo "Packaging Runner.app into Payload..."
          mkdir -p build/ios/ipa/Payload
          
          # Use the freshly built Runner.app
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          
          cd build/ios/ipa && zip -ry DARB.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARB-iOS-Release-IPA
          path: apps/mobile/build/ios/ipa/DARB.ipa
